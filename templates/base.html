<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AKEMIN - サロン在庫管理システム{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block nav %}
  <header class="site-header">
    <div class="header-inner">
      <a href="/dashboard" class="logo">AKEMIN</a>
      <nav class="main-nav" id="main-nav">
        <a href="/dashboard" class="nav-link">棚を見る</a>
        <a href="/orders" class="nav-link">発注データ分析</a>
        <div class="nav-dropdown" id="nav-stock">
          <button type="button" class="nav-link nav-dropdown-toggle" id="nav-stock-toggle" aria-expanded="false" aria-haspopup="true">
            補充/使用
          </button>
          <div class="nav-dropdown-menu" id="nav-stock-menu" role="menu" hidden>
            <a href="/stock/replenish" class="nav-dropdown-item" role="menuitem">棚に補充する</a>
            <a href="/stock/consume" class="nav-dropdown-item" role="menuitem">使用済みゴミ箱</a>
          </div>
        </div>
        <a href="/admin/products" class="nav-link nav-admin" id="nav-admin" hidden>マスタ管理 &amp; 設定 ⚙️</a>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-logout">ログアウト</button>
      </nav>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-label="メニュー">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
  {% endblock %}

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>AKEMIN — サロン在庫管理システム</p>
  </footer>

  <script src="/static/js/api.js?v=3"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
