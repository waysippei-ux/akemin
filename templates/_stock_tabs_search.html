{# 商品検索タブ（補充・使用共通） #}
<div id="tab-search" class="stock-tab-content" style="display:block">
  <div class="filter-bar-standard card stock-search-filters">
    <h2 class="section-title">絞り込み</h2>
    <div class="filter-grid">
      <div class="filter-field">
        <label for="filter-section">棚</label>
        <select id="filter-section" class="select">
          <option value="">すべて</option>
          {% for sec in sections %}
          <option value="{{ sec.id }}">{{ sec.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="filter-field">
        <label for="filter-category">カテゴリ</label>
        <select id="filter-category" class="select">
          <option value="">すべて</option>
          {% for c in categories %}
          <option value="{{ c.id }}" data-section="{{ c.section }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="filter-field">
        <label for="filter-maker">メーカー</label>
        <select id="filter-maker" class="select">
          <option value="">すべて</option>
          {% for m in makers %}
          <option value="{{ m.id }}">{{ m.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="filter-field">
        <label for="filter-dealer">ディーラー</label>
        <select id="filter-dealer" class="select">
          <option value="">すべて</option>
          {% for d in dealers %}
          <option value="{{ d.id }}">{{ d.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="filter-field filter-field-grow">
        <label for="filter-name">商品名</label>
        <input type="search" id="filter-name" class="input-text" placeholder="部分一致で検索" autocomplete="off">
      </div>
    </div>
    <button type="button" class="btn btn-secondary btn-sm btn-filter-reset" id="btn-filter-reset">絞り込みリセット</button>
  </div>
  <div id="product-grid" class="product-grid"></div>
  <p id="product-empty" class="empty-msg" hidden>該当する商品がありません</p>
</div>
