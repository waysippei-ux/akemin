{% extends "base.html" %}

{% block title %}棚を見る — AKEMIN{% endblock %}

{% block content %}
<section class="page-header">
  <h1 id="page-title">棚を見る</h1>
  <p class="page-desc" id="user-greeting">読み込み中…</p>
</section>

<div class="toolbar card">
  <label for="store-select" class="toolbar-label">店舗</label>
  <select id="store-select" class="select"></select>
  <button type="button" class="btn btn-secondary btn-sm" id="btn-refresh">更新</button>
</div>

<!-- TOP: 棚ごとのカテゴリ -->
<div id="view-categories">
  <p id="categories-loading" class="loading">読み込み中…</p>
  <div id="dashboard-sections"></div>
</div>

<!-- カテゴリ内: 棚一覧 + AI -->
<div id="view-detail" hidden>
  <nav class="breadcrumb card">
    <button type="button" class="btn btn-ghost btn-sm" id="btn-back-categories">← カテゴリ一覧</button>
    <span id="breadcrumb-category"></span>
  </nav>

  <section class="advice-section card">
    <h2 class="section-title">AI 発注アドバイス</h2>
    <div id="advice-loading" class="loading">分析中…</div>
    <p id="advice-text" class="advice-text" hidden></p>
  </section>

  <section class="inventory-section">
    <h2 class="section-title">棚の状況</h2>
    <div class="stock-legend">
      <span class="legend-item legend-green">十分</span>
      <span class="legend-item legend-yellow">要発注</span>
      <span class="legend-item legend-red">至急</span>
    </div>
    <div id="inventory-loading" class="loading">読み込み中…</div>
    <div id="inventory-list" class="card-grid" hidden></div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/dashboard.js?v=10"></script>
{% endblock %}
