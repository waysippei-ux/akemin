{# スキャン・一括タブ（補充・使用共通） #}
<div id="tab-scan" class="stock-tab-content" style="display:none">
  <div class="scanner-section card scan-search-card">
    <p class="scan-search-title">バーコードを入力またはスキャナーで読み込む</p>
    <div class="scan-search-row">
      <input
        type="text"
        id="scanner-input"
        class="input-text scan-search-input"
        placeholder="手入力またはスキャナーで入力"
        inputmode="text"
        autocomplete="off"
        maxlength="13"
        aria-label="バーコード"
      >
      <button type="button" class="btn scan-search-btn" id="btn-scan-search">検索する</button>
    </div>
  </div>
</div>

<div id="tab-bulk" class="stock-tab-content" style="display:none">
  <div class="card">
    <div class="bulk-actions">
      <button type="button" class="btn btn-primary" id="btn-bulk-camera">カメラ開始</button>
      <label class="btn btn-secondary">
        写真/PDFアップロード
        <input type="file" id="bulk-file" accept="image/jpeg,image/png,image/webp,application/pdf" hidden>
      </label>
    </div>
    <div id="reader-bulk" class="barcode-reader" style="display:none"></div>
    <p id="bulk-parse-note" class="hint-text" style="display:none"></p>
    <div id="bulk-lines-wrap" style="display:none">
      <ul id="bulk-lines" class="bulk-lines"></ul>
      <button type="button" class="btn btn-primary" id="btn-bulk-submit" disabled>まとめて登録する</button>
    </div>
    <p id="bulk-empty" class="empty-msg">カメラでスキャンするか、ファイルをアップロードしてください</p>
  </div>
</div>
